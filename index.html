<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>QuizWiz - Ultimate Trivia & Gaming Mobile App</title>
    <link rel="icon" type="image/jpeg" href="/app-logo.jpg" />
    <link rel="apple-touch-icon" href="/app-logo.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#040112" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QuizWiz" />
  </head>
  <body class="bg-[#040112] text-white antialiased select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('QuizWiz PWA Service Worker registered:', reg.scope);
          }).catch((err) => {
            console.log('QuizWiz SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
